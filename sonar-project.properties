# SonarCloud analysis of the whole repo, run by the Jenkinsfile after the tests (which write the
# coverage reports below). https://sonarcloud.io/project/overview?id=jassernoomani_Winou
sonar.organization=jassernoomani
sonar.projectKey=jassernoomani_Winou
sonar.projectName=Winou
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main,ml-service/app,ml-service/scripts,mobile/lib
sonar.tests=backend/src/test,ml-service/tests,mobile/test
# Generated by flutter gen-l10n
sonar.exclusions=mobile/lib/l10n/app_localizations*.dart

# Backend (Java 25)
sonar.java.source=25
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# ML service
sonar.python.version=3.12
sonar.python.coverage.reportPaths=ml-service/coverage.xml

# App
sonar.dart.lcov.reportPaths=mobile/coverage/lcov.info
