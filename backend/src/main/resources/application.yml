# Every setting can be overridden with an environment variable (see .env.example).
spring:
  application:
    name: winou
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/winou}
    username: ${DB_USER:winou}
    password: ${POSTGRES_PASSWORD:winou}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none  # the schema is owned by Flyway
    properties:
      hibernate:
        timezone.default_storage: NORMALIZE_UTC
  flyway:
    # Adopts a database created by the Python API (Alembic): baseline at 0, then V1/V2 are idempotent
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 25MB     # backstop; the real limit is winou.uploads.max-mb, with a clear error
      max-request-size: 26MB
  threads:
    virtual:
      enabled: true
  # Sign-in codes by email. Gmail: MAIL_USERNAME is the address, MAIL_PASSWORD an app password
  # (Google account > Security > 2-Step Verification > App passwords). Without them, emails are logged.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  # Behind Caddy: the client's address comes from X-Forwarded-For, trusted from private networks only
  forward-headers-strategy: native
  error:
    whitelabel:
      enabled: false

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /openapi.json

winou:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-at-least-32-bytes}
    expiry: ${JWT_EXPIRE_MINUTES:60}m   # the app renews it with its refresh token
  ml:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout: 120s
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    api-key: ${QDRANT_API_KEY:}
    collection: ${QDRANT_COLLECTION:pet_photos}
    embed-dim: ${EMBED_DIM:1536}
  s3:
    endpoint: ${S3_ENDPOINT:localhost:9000}
    secure: ${S3_SECURE:false}
    access-key: ${S3_ACCESS_KEY:winou}
    secret-key: ${S3_SECRET_KEY:winou-dev-secret}
    bucket: ${S3_BUCKET:winou-photos}
  uploads:
    max-mb: ${MAX_UPLOAD_MB:10}
    max-image-pixels: ${MAX_IMAGE_PIXELS:40000000}
    public-image-max-side: ${PUBLIC_IMAGE_MAX_SIDE:2048}
  privacy:
    location-fuzz-m: ${LOCATION_FUZZ_M:300}
    # Separate from JWT_SECRET and never rotated: a new value moves every public position,
    # and comparing old and new positions narrows down the real one.
    location-fuzz-secret: ${LOCATION_FUZZ_SECRET:dev-only-insecure-fuzz-secret}
  map:
    max-results: ${MAP_MAX_RESULTS:500}
  rate-limits:
    lost-reports-per-day: ${RATE_LIMIT_LOST_REPORTS_PER_DAY:5}
    sightings-per-hour: ${RATE_LIMIT_SIGHTINGS_PER_HOUR:20}
    photos-per-hour: ${RATE_LIMIT_PHOTOS_PER_HOUR:60}
    messages-per-hour: ${RATE_LIMIT_MESSAGES_PER_HOUR:60}
  matching:
    threshold-dog: ${MATCH_THRESHOLD_DOG:0.60}
    threshold-cat: ${MATCH_THRESHOLD_CAT:0.70}
    radius-km: ${MATCH_RADIUS_KM:10}
    lost-window-days: ${MATCH_LOST_WINDOW_DAYS:60}
    sighting-grace-days: ${MATCH_SIGHTING_GRACE_DAYS:2}
    max-notifications: ${MATCH_MAX_NOTIFICATIONS:3}
  worker:
    # The same jar runs the API and, with WINOU_WORKER_ENABLED=true, the photo worker
    enabled: ${WINOU_WORKER_ENABLED:false}
    poll: ${WORKER_POLL_SECONDS:2}s
    max-attempts: ${WORKER_MAX_ATTEMPTS:5}
  firebase:
    # Service account key for push notifications; without it they are only logged
    credentials: ${FIREBASE_CREDENTIALS:}
  strays:
    fade-days: ${STRAY_FADE_DAYS:30}
  associations:
    alert-radius-km: ${ASSOCIATION_ALERT_RADIUS_KM:10}
  moderation:
    hide-after-reports: ${HIDE_AFTER_REPORTS:3}
    reports-per-day: ${RATE_LIMIT_REPORTS_PER_DAY:20}
  auth:
    refresh-token-days: ${REFRESH_TOKEN_DAYS:90}         # signed out after this long without opening the app
    login-attempts-per-email: ${LOGIN_ATTEMPTS_PER_EMAIL:5}
    login-attempts-per-ip: ${LOGIN_ATTEMPTS_PER_IP:30}
    login-attempt-window: ${LOGIN_ATTEMPT_WINDOW_MINUTES:15}m
    registrations-per-ip-per-hour: ${REGISTRATIONS_PER_IP_PER_HOUR:10}
  mail:
    from-name: ${MAIL_FROM_NAME:Winou}
  share:
    # Shared lost-pet links (https://<domain>/lost/<id>) open the app when it's installed: Android
    # checks this package and the SHA-256 of the key that signs the APK (this laptop's debug key).
    android-package: ${ANDROID_PACKAGE:tn.winou.winou}
    android-cert-sha256: ${ANDROID_CERT_SHA256:F6:00:34:81:4D:B6:5F:94:94:BC:95:18:98:DE:C8:D6:69:61:B1:A1:DC:B8:8E:68:F0:3E:8D:D0:8D:09:3D:26}
  google:
    # The project's Web client ID (Firebase console: Authentication > Google > Web SDK configuration)
    client-ids: ${GOOGLE_CLIENT_IDS:}
  admin:
    # Comma-separated: these accounts review association requests and reported content in the app
    emails: ${ADMIN_EMAILS:}
