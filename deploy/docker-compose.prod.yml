# Production overrides for the demo server (Oracle Cloud Always Free, ARM). Used on top of the
# main file, from the repo root:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from outside (80/443, HTTPS from Let's Encrypt). Everything else talks
# over the compose network.
services:
  postgres:
    # Same PostGIS image as postgis/postgis, also built for ARM (the official one is x86 only).
    # A PC that already has data from the official image keeps it: POSTGIS_IMAGE=postgis/postgis:18-3.6
    image: ${POSTGIS_IMAGE:-imresamu/postgis:18-3.6}
    ports: !reset []

  minio:
    ports: !reset []

  qdrant:
    ports: !reset []

  ml-service:
    ports: !reset []
    mem_limit: 6g

  api:
    # This machine only (scripts, USB demos); the internet goes through Caddy
    ports: !override
      - "127.0.0.1:8080:8080"
    mem_limit: 1536m   # the JVM takes 75% of this as heap

  worker:
    mem_limit: 1536m

  caddy:
    image: caddy:2.10
    environment:
      WINOU_DOMAIN: ${WINOU_DOMAIN:?set WINOU_DOMAIN in .env, e.g. winou.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/download:/srv/download:ro   # the app's APK, see deploy/README.md
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  # Monitoring (deploy/monitoring/). Grafana is on this machine only: http://localhost:3000
  prometheus:
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/winou?sslmode=disable
      DATA_SOURCE_USER: winou
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-winou}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/winou.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
