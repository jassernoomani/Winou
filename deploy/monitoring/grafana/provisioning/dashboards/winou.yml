apiVersion: 1

# Dashboards are files in the repo (deploy/monitoring/grafana/dashboards/); edits made in the UI are
# not saved back, so export the JSON and commit it instead.
providers:
  - name: winou
    folder: Winou
    type: file
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
